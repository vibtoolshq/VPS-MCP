name: vps-mcp
services:
  init-data:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown 10001:10001 /data && chmod 0700 /data"]
    volumes:
      - mcp-data:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vps-mcp:local
    restart: unless-stopped
    init: true
    depends_on:
      init-data:
        condition: service_completed_successfully
    user: "10001:10001"
    env_file:
      - .env
    ports:
      - "127.0.0.1:${MCP_BIND_PORT:-3000}:3000"
    volumes:
      - mcp-data:/data:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks: [isolated]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  mcp-data:
networks:
  isolated:
    driver: bridge
