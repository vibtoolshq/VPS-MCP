name: Pin dependency lockfile (one-time build maintenance)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  pin-lock:
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo "Lockfile already generated; nothing to change."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit resolved package-lock.json for reproducible installs"
          git push origin HEAD:main
