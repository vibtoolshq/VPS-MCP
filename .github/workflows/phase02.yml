name: VPS-MCP security and private Compose CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - name: Automatic installer and Docker Compose smoke test
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --remove-orphans >/dev/null 2>&1 || true; rm -f .env "$RUNNER_TEMP/vpsmcp-install.log"' EXIT
          bash scripts/install.sh >"$RUNNER_TEMP/vpsmcp-install.log" 2>&1
          grep -q 'ONE-TIME FIRST-LOGIN SETUP' "$RUNNER_TEMP/vpsmcp-install.log"
          test "$(stat -c '%a' .env)" = '600'
          docker compose config --quiet
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/api/setup/status | grep -q '"required":true'
          test "$(docker compose exec -T api id -u | tr -d '\r')" = '10001'
          docker compose exec -T api node -e "if(require('fs').existsSync('/var/run/docker.sock'))process.exit(1)"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q api)")" = 'true'
          # Browser-based account bootstrap is backed by real container persistence.
          token="$(sed -n 's/^Setup token: //p' "$RUNNER_TEMP/vpsmcp-install.log" | head -1)"
          test "${#token}" -eq 64
          curl -fsS -H 'content-type: application/json' -d "{\"token\":\"$token\",\"username\":\"admin\",\"password\":\"StrongNewPassphrase-2026!\",\"confirm\":\"StrongNewPassphrase-2026!\"}" http://127.0.0.1:3000/api/setup | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:3000/api/setup/status | grep -q '"required":false'
          docker compose restart api >/dev/null
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/setup/status | grep -q '"required":false'
          curl -fsS -H 'content-type: application/json' -d '{"username":"admin","password":"StrongNewPassphrase-2026!"}' http://127.0.0.1:3000/api/login | grep -q '"ok":true'
          bash -n scripts/apply-network.sh
          # Verify private host-port apply and reversal on this disposable CI VPS.
          docker compose exec -T api node -e 'const fs=require("node:fs");fs.writeFileSync("/data/network-draft.json",JSON.stringify({version:1,domain:"",hostPort:3331,sslMode:"private-only"}),{mode:0o600})'
          bash scripts/apply-network.sh
          curl --fail --silent -H 'Host: 127.0.0.1:3000' http://127.0.0.1:3331/health
          grep -qx 'MCP_BIND_PORT=3331' .env
          docker compose exec -T api node -e 'const fs=require("node:fs");fs.writeFileSync("/data/network-draft.json",JSON.stringify({version:1,domain:"",hostPort:3000,sslMode:"private-only"}),{mode:0o600})'
          bash scripts/apply-network.sh
          curl --fail --silent http://127.0.0.1:3000/health
          grep -qx 'MCP_BIND_PORT=3000' .env
          # Ensure private provider credentials are included in backup and isolated restore.
          # This is a FAKE token: no real Cloudflare account is contacted by CI.
          docker compose exec -T api node -e 'const fs=require("node:fs");fs.writeFileSync("/data/dns-provider.json",JSON.stringify({version:1,zoneId:"a".repeat(32),zoneName:"example.org",token:"fake-test-token-with-32-characters"}),{mode:0o600})'
          bash scripts/backup.sh "$RUNNER_TEMP/vpsmcp-backup"
          backup="$(find "$RUNNER_TEMP/vpsmcp-backup" -mindepth 1 -maxdepth 1 -type d | head -1)"
          bash scripts/check-backup.sh "$backup"
          tar -tzf "$backup/data.tar.gz" | grep -q 'admin.json'
          tar -tzf "$backup/data.tar.gz" | grep -q 'dns-provider.json'
          # Missing .env must not silently reset an existing Docker volume.
          mv .env "$RUNNER_TEMP/vpsmcp-env-saved"
          if bash scripts/install.sh >"$RUNNER_TEMP/reset-check.log" 2>&1; then
            echo "Installer mistakenly reset configuration over a populated data volume" >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/vpsmcp-env-saved" .env
          chmod 600 .env
          # Restore without deleting or overwriting the source deployment volume.
          restore_root="$RUNNER_TEMP/vpsmcp-independent-restore"
          mkdir -p "$restore_root"
          cp -a scripts src public Dockerfile compose.yaml package.json package-lock.json tsconfig.json "$restore_root/"
          docker compose stop api >/dev/null
          (
            cd "$restore_root"
            export COMPOSE_PROJECT_NAME=vps-mcp-restore-ci
            bash scripts/restore.sh "$backup"
            for i in {1..25}; do
              if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:3000/api/setup/status | grep -q '"required":false'
            docker compose exec -T api node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("/data/dns-provider.json","utf8"));if(x.zoneName!=="example.org"||x.token!=="fake-test-token-with-32-characters")process.exit(1)'
            curl -fsS -H 'content-type: application/json' -d '{"username":"admin","password":"StrongNewPassphrase-2026!"}' http://127.0.0.1:3000/api/login | grep -q '"ok":true'
            docker compose down --remove-orphans
          )
          # The source project's Docker data remains untouched.
